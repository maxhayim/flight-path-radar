name: Flight Path Radar
description: Fly a stealth plane across your GitHub contribution grid on a radar screen, as an animated SVG.
author: maxhayim
branding:
  icon: navigation
  color: green

inputs:
  github_user_name:
    description: GitHub user whose contribution grid to fly over.
    required: true
  outputs:
    description: |
      One output file per line. Add ?plane=<name> and/or ?theme=<name> to pick them for that file.
      Planes: b2, f117, f22, sr71, biplane. Themes: radar, cockpit.
      Example: dist/flight-path.svg?plane=f117&theme=cockpit
    required: false
    default: dist/flight-path.svg
  plane:
    description: Default plane for outputs that don't set ?plane=.
    required: false
    default: b2
  theme:
    description: Default theme for outputs that don't set ?theme=. "radar" (scope only) or "cockpit" (framed to match Cockpit Telemetry).
    required: false
    default: radar
  year:
    description: Calendar year to show, e.g. 2025. Leave empty for the last 12 months. Can't be combined with from/to.
    required: false
    default: ""
  from:
    description: Start date (YYYY-MM-DD) of a custom range. The range can be at most one year.
    required: false
    default: ""
  to:
    description: End date (YYYY-MM-DD) of a custom range. Defaults to one year after from, or today.
    required: false
    default: ""
  github_token:
    description: Token used to read the contribution calendar.
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 20
    - shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        FLIGHT_PATH_PLANE: ${{ inputs.plane }}
        FLIGHT_PATH_THEME: ${{ inputs.theme }}
        FLIGHT_PATH_YEAR: ${{ inputs.year }}
        FLIGHT_PATH_FROM: ${{ inputs.from }}
        FLIGHT_PATH_TO: ${{ inputs.to }}
        FP_USER: ${{ inputs.github_user_name }}
        FP_OUTPUTS: ${{ inputs.outputs }}
      run: node "${{ github.action_path }}/src/cli.mjs" "$FP_USER" "$FP_OUTPUTS"
